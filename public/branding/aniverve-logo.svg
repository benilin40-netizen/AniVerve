<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 108" fill="none" role="img" aria-label="AniVerve - Anime Beyond Borders">
  <defs>
    <linearGradient id="avl-a-grad" x1="20" y1="14" x2="86" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="45%" stop-color="#9B87FF" />
      <stop offset="100%" stop-color="#6844F5" />
    </linearGradient>
    <linearGradient id="avl-orbit-back" x1="12" y1="72" x2="96" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B3CE8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8B6EFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="avl-orbit-front" x1="10" y1="76" x2="98" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6844F5" />
      <stop offset="52%" stop-color="#9B87FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="avl-star-grad" x1="92" y1="18" x2="110" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
    <linearGradient id="avl-word-grad" x1="118" y1="22" x2="360" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6844F5" />
      <stop offset="52%" stop-color="#8668FF" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
  </defs>

  <!-- Emblem positioned cleanly on left -->
  <g transform="translate(2, 0) scale(0.84375)">
    <g transform="rotate(-24 64 66)">
      <path
        fill="none"
        d="M 14 66 A 50 18 0 0 1 114 66"
        stroke="url(#avl-orbit-back)"
        stroke-width="6.8"
        stroke-linecap="round"
      />
    </g>

    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 64 17 L 103 105 L 86 105 L 77.5 85.5 L 55 85.5 L 43 105 L 25 105 L 64 17 Z M 64 41.5 L 52.5 70 L 74.5 64 L 64 41.5 Z"
      fill="url(#avl-a-grad)"
    />

    <path
      d="M 41 79.5 C 53 71.5 70 67.5 86 67 L 82 76.5 C 67 77 52 80.5 38 87.5 Z"
      fill="#E9D5FF"
      fill-opacity="0.92"
    />

    <g transform="rotate(-24 64 66)">
      <path
        fill="none"
        d="M 114 66 A 50 18 0 0 1 14 66"
        stroke="url(#avl-orbit-front)"
        stroke-width="7.4"
        stroke-linecap="round"
      />
    </g>

    <path
      d="M 101 18 L 103.8 25.2 L 111 28 L 103.8 30.8 L 101 38 L 98.2 30.8 L 91 28 L 98.2 25.2 Z"
      fill="url(#avl-star-grad)"
    />
    <circle cx="88" cy="18" r="2.2" fill="#9B87FF" />
  </g>

  <!-- Main Wordmark: Rich violet-purple gradient calibrated for both light and dark surfaces -->
  <text
    x="120"
    y="59"
    font-family="Plus Jakarta Sans, Inter, Liberation Sans, DejaVu Sans, system-ui, -apple-system, sans-serif"
    font-size="48"
    font-weight="800"
    letter-spacing="-1.2"
    fill="url(#avl-word-grad)"
  >
    AniVerve
  </text>

  <!-- Tagline -->
  <text
    x="123"
    y="83"
    font-family="DM Sans, Inter, Liberation Sans, DejaVu Sans, system-ui, -apple-system, sans-serif"
    font-size="11.5"
    font-weight="700"
    letter-spacing="3.8"
    fill="#746D94"
  >
    ANIME BEYOND BORDERS
  </text>
</svg>
