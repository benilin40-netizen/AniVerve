<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="AniVerve Icon">
  <defs>
    <linearGradient id="av-a-grad" x1="26" y1="18" x2="102" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="45%" stop-color="#9B87FF" />
      <stop offset="100%" stop-color="#6844F5" />
    </linearGradient>
    <linearGradient id="av-orbit-back" x1="16" y1="84" x2="112" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B3CE8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#8B6EFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.45" />
    </linearGradient>
    <linearGradient id="av-orbit-front" x1="14" y1="90" x2="114" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6844F5" />
      <stop offset="52%" stop-color="#9B87FF" />
      <stop offset="100%" stop-color="#DDD6FE" />
    </linearGradient>
    <linearGradient id="av-star-grad" x1="92" y1="18" x2="110" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#7C5CFF" />
    </linearGradient>
  </defs>

  <!-- Back orbital sweep behind the letter A -->
  <g transform="rotate(-24 64 66)">
    <path
      fill="none"
      d="M 14 66 A 50 18 0 0 1 114 66"
      stroke="url(#av-orbit-back)"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Distinctive stylized geometric A with kinetic crossbar -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M 64 17 L 103 105 L 86 105 L 77.5 85.5 L 55 85.5 L 43 105 L 25 105 L 64 17 Z M 64 41.5 L 52.5 70 L 74.5 64 L 64 41.5 Z"
    fill="url(#av-a-grad)"
  />

  <!-- Kinetic forward slash crossbar accent -->
  <path
    d="M 41 79.5 C 53 71.5 70 67.5 86 67 L 82 76.5 C 67 77 52 80.5 38 87.5 Z"
    fill="#E9D5FF"
    fill-opacity="0.92"
  />

  <!-- Front orbital ring crossing dynamically in front of the A -->
  <g transform="rotate(-24 64 66)">
    <path
      fill="none"
      d="M 114 66 A 50 18 0 0 1 14 66"
      stroke="url(#av-orbit-front)"
      stroke-width="7.2"
      stroke-linecap="round"
    />
  </g>

  <!-- Small 4-point sparkle star on upper orbital arc -->
  <path
    d="M 101 18 L 103.8 25.2 L 111 28 L 103.8 30.8 L 101 38 L 98.2 30.8 L 91 28 L 98.2 25.2 Z"
    fill="url(#av-star-grad)"
  />
  <circle cx="88" cy="18" r="2.2" fill="#9B87FF" />
</svg>
